metric: COCO
num_classes: 6

TrainDataset:
  name: COCODataSet
  image_dir: train
  anno_path: annotations/train.json
  dataset_dir: dataset/AutoDrive
  data_fields: ['image', 'gt_bbox', 'gt_class', 'is_crowd']

EvalDataset:
  name: COCODataSet
  image_dir: train
  anno_path: annotations/val.json
  dataset_dir: dataset/AutoDrive

TestDataset:
  name: test
  # anno_path: annotations/instances_val2017.json # also support txt (like VOC's label_list.txt)
  dataset_dir: dataset/AutoDrive # if set, anno_path will be 'dataset_dir/anno_path'
